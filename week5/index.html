<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니 쇼핑몰</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">JWAEUNSEOK</div>
        <nav class="menu">
            <a href="#">홈</a>
            <a href="#">신상품</a>
            <a href="#">베스트</a>
            <a href="#">문의</a>
        </nav>
        <div class="cart">장바구니 (0)</div>
    </header>

    <section class="main-banner">
        <div class="banner-text">
            <h1>2026 S/S 시즌 오프 세일</h1>
            <p>최대 50% 할인된 가격으로 만나보세요.</p>
        </div>
    </section>

    <main class="product-container">
        <div class="product-grid">
            <div class="product-item">
                <div class="badge sale">SALE</div>
                <div class="product-img"></div>
                <h3>수국 플라워 화병</h3>
                <p>15,000원</p>
            </div>

            <div class="product-item">
                <div class="badge new">NEW</div>
                <div class="product-img"></div>
                <h3>모던 데스크 매트</h3>
                <p>22,000원</p>
            </div>

            <div class="product-item">
                <div class="badge sale">SALE</div>
                <div class="product-img"></div>
                <h3>무선 블루투스 스피커</h3>
                <p>49,000원</p>
            </div>

            <div class="product-item">
                <div class="badge new">NEW</div>
                <div class="product-img"></div>
                <h3>아로마 디퓨저 세트</h3>
                <p>18,000원</p>
            </div>

            <div class="product-item">
                <div class="product-img"></div>
                <h3>미니멀 탁상 시계</h3>
                <p>25,000원</p>
            </div>

            <div class="product-item">
                <div class="badge sale">SALE</div>
                <div class="product-img"></div>
                <h3>코튼 캔버스 에코백</h3>
                <p>12,000원</p>
            </div>
        </div>
    </main>
</body>
</html>
