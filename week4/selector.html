<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Condensed:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <title>CSS 과제</title>
    <style>
        body {
            font-family: "Libre Caslon Condensed", serif;
        }
        
        h1 {
            color: violet;
            font-size: 40px;
            text-align: center;
            width: 300px;
            height: 60px;
            padding: 20px;
            border: 2px solid black;
            margin: 30px auto;
        }
        
        .a {
            color: red;
            font-weight: bold;
        }
        
        .b {
            color: blue;
            font-style: italic;
        }
        
        .c {
            color: green;
            letter-spacing: 5px;
        }
        
        div > p {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>hello</h1>
    
    <p class="a">abc</p>
    <p class="b">def</p>
    <p class="c">ghi</p>
    <div>
        <p>자식 결합 선택자 적용</p>
    </div>
</body>
</html>
